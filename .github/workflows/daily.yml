name: Daily free zone AI watch

on:
  schedule:
    - cron: "7 4 * * *"    # 08:07 Dubai time
    - cron: "7 14 * * *"   # 18:07 Dubai time - second pass catches afternoon releases and covers a failed morning run
  workflow_dispatch:
    inputs:
      lookback:
        description: "Days to look back (use 30 for a first backfill)"
        required: false
        default: "3"
  push:
    branches: [main]
    paths: ["docs/**", "tracker/**", ".github/workflows/daily.yml"]

permissions:
  contents: write
  issues: write

concurrency:
  group: daily-watch
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (incl. headless browser fallback)
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run tests
        run: python -m unittest discover -s tests -t . -v

      - name: Fetch, classify and publish
        if: github.event_name != 'push'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          DIGEST_TO: ${{ vars.DIGEST_TO }}
        run: python -m tracker.run ${{ github.event.inputs.lookback && format('--lookback {0}', github.event.inputs.lookback) || '' }}

      - name: Rebuild site from stored data
        if: github.event_name == 'push'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python -m tracker.publish_only

      - name: Commit updated data
        if: github.event_name != 'push'
        run: |
          git config user.name "freezone-ai-watch[bot]"
          git config user.email "freezone-ai-watch@users.noreply.github.com"
          git add data/items.json data/state.json data/health.json data/HEALTH.md digests docs/data docs/feed.xml
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Daily update $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done

      - name: Open or update the source-health issue
        if: github.event_name != 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alerts=$(python -c "import json;d=json.load(open('docs/data/items.json'));print(len(d['health']['alerts']))")
          existing=$(gh issue list --label source-health --state open --json number -q '.[0].number' || true)
          if [ "$alerts" -gt 0 ]; then
            gh label create source-health --color B60205 --description "Scraper health alerts" 2>/dev/null || true
            if [ -n "$existing" ]; then
              gh issue edit "$existing" --body-file data/HEALTH.md
            else
              gh issue create --title "Source health: scrapers need attention" --label source-health --body-file data/HEALTH.md
            fi
          elif [ -n "$existing" ]; then
            gh issue close "$existing" --comment "All sources healthy again as of $(date -u +%Y-%m-%d)."
          fi

      - name: Publish docs/ to the gh-pages branch (served by GitHub Pages)
        run: |
          git fetch origin main
          git push --force origin "$(git subtree split --prefix docs origin/main)":refs/heads/gh-pages
